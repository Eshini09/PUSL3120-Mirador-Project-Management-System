<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="820" viewBox="0 0 1450 820" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3: WebSocket Event Flow Diagram</title>
  <desc id="desc">Black and white event flow diagram showing a task update from User A, REST API request, JWT verification, MongoDB save, Socket.IO event emission, and automatic update in User B browser.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111111"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #111111;
      }
      .title {
        font-size: 24px;
        font-weight: 700;
      }
      .box {
        fill: #ffffff;
        stroke: #111111;
        stroke-width: 2;
      }
      .smallBox {
        fill: #ffffff;
        stroke: #555555;
        stroke-width: 1.5;
      }
      .header {
        font-size: 15px;
        font-weight: 700;
      }
      .label {
        font-size: 13px;
      }
      .step {
        font-size: 14px;
        font-weight: 700;
      }
      .line {
        stroke: #111111;
        stroke-width: 1.8;
        marker-end: url(#arrow);
      }
      .dash {
        stroke: #111111;
        stroke-width: 1.8;
        stroke-dasharray: 7 6;
        marker-end: url(#arrow);
      }
      .life {
        stroke: #777777;
        stroke-width: 1.3;
        stroke-dasharray: 6 8;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1448" height="818" fill="#ffffff" stroke="#111111" stroke-width="1"/>
  <text x="725" y="48" text-anchor="middle" class="title">Figure 3: WebSocket Event Flow Diagram</text>

  <!-- Participant boxes -->
  <rect x="55" y="95" width="170" height="64" class="box"/>
  <text x="140" y="122" text-anchor="middle" class="header">User A Browser</text>
  <text x="140" y="145" text-anchor="middle" class="label">manager/client</text>

  <rect x="285" y="95" width="180" height="64" class="box"/>
  <text x="375" y="122" text-anchor="middle" class="header">React Frontend</text>
  <text x="375" y="145" text-anchor="middle" class="label">UI + API client</text>

  <rect x="530" y="95" width="205" height="64" class="box"/>
  <text x="632" y="122" text-anchor="middle" class="header">Express / Node Server</text>
  <text x="632" y="145" text-anchor="middle" class="label">routes + controllers</text>

  <rect x="800" y="95" width="155" height="64" class="box"/>
  <text x="877" y="122" text-anchor="middle" class="header">MongoDB</text>
  <text x="877" y="145" text-anchor="middle" class="label">persistent data</text>

  <rect x="1020" y="95" width="155" height="64" class="box"/>
  <text x="1097" y="122" text-anchor="middle" class="header">Socket.IO</text>
  <text x="1097" y="145" text-anchor="middle" class="label">event channel</text>

  <rect x="1235" y="95" width="170" height="64" class="box"/>
  <text x="1320" y="122" text-anchor="middle" class="header">User B Browser</text>
  <text x="1320" y="145" text-anchor="middle" class="label">connected client</text>

  <!-- Lifelines -->
  <line x1="140" y1="160" x2="140" y2="705" class="life"/>
  <line x1="375" y1="160" x2="375" y2="705" class="life"/>
  <line x1="632" y1="160" x2="632" y2="705" class="life"/>
  <line x1="877" y1="160" x2="877" y2="705" class="life"/>
  <line x1="1097" y1="160" x2="1097" y2="705" class="life"/>
  <line x1="1320" y1="160" x2="1320" y2="705" class="life"/>

  <!-- Step 1 -->
  <line x1="140" y1="220" x2="375" y2="220" class="line"/>
  <text x="160" y="207" class="step">1</text>
  <text x="190" y="207" class="label">User updates task / comment / milestone</text>

  <!-- Step 2 -->
  <line x1="375" y1="295" x2="632" y2="295" class="line"/>
  <text x="395" y="282" class="step">2</text>
  <text x="425" y="282" class="label">REST API request</text>
  <text x="425" y="310" class="label">PUT /api/tasks/:id or POST /api/comments</text>

  <!-- Step 3 -->
  <rect x="532" y="345" width="200" height="76" class="smallBox"/>
  <text x="632" y="373" text-anchor="middle" class="step">3</text>
  <text x="632" y="395" text-anchor="middle" class="label">Verify JWT token</text>
  <text x="632" y="414" text-anchor="middle" class="label">Check role and project access</text>

  <!-- Step 4 -->
  <line x1="632" y1="465" x2="877" y2="465" class="line"/>
  <text x="652" y="452" class="step">4</text>
  <text x="682" y="452" class="label">Save updated document</text>

  <!-- Step 5 -->
  <line x1="877" y1="520" x2="632" y2="520" class="dash"/>
  <text x="652" y="507" class="step">5</text>
  <text x="682" y="507" class="label">Return saved task/comment data</text>

  <!-- Step 6 -->
  <line x1="632" y1="575" x2="1097" y2="575" class="line"/>
  <text x="652" y="562" class="step">6</text>
  <text x="682" y="562" class="label">Emit Socket.IO event, e.g. task:updated</text>

  <!-- Step 7 -->
  <line x1="1097" y1="630" x2="1320" y2="630" class="line"/>
  <text x="1117" y="617" class="step">7</text>
  <text x="1147" y="617" class="label">Connected client receives event</text>

  <!-- Step 8 -->
  <rect x="1216" y="665" width="208" height="64" class="smallBox"/>
  <text x="1320" y="691" text-anchor="middle" class="step">8</text>
  <text x="1320" y="713" text-anchor="middle" class="label">UI refreshes without</text>
  <text x="1320" y="731" text-anchor="middle" class="label">manual page reload</text>
</svg>
